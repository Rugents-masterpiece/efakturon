version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: efakturon
      POSTGRES_USER: efakturon
      POSTGRES_PASSWORD: ${DB_PASSWORD:-efakturon_dev_password}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efakturon"]
      interval: 5s
      timeout: 5s
      retries: 5

  efakturon:
    build: .
    ports:
      - "5050:5050"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=efakturon;Username=efakturon;Password=${DB_PASSWORD:-efakturon_dev_password}
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5050
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
